[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobook-finder"
version = "0.1.0"
description = "Local audiobook duplicate discovery and review"
requires-python = ">=3.11"
dependencies = ["mutagen>=1.47", "PySide6>=6.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
audiobook-finder = "audiobook_finder.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]